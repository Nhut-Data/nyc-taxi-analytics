name: 'nyc_taxi'
version: '1.0.0'
config-version: 2

profile: 'nyc_taxi'

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  nyc_taxi:
    staging:
      +schema: nyc_taxi_staging
      +materialized: view
    intermediate:
      +schema: nyc_taxi_intermediate
      +materialized: view
    marts:
      +schema: nyc_taxi_marts
      +materialized: table
