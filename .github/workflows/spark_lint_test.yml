name: Spark Lint & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'spark_jobs/**'
      - 'tests/**'
      - 'ingestion/**'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: |
          pip install pyspark==3.5.3 \
            pyarrow==15.0.0 \
            pandas==2.2.0 \
            pytest==8.3.0 \
            black==24.0.0 \
            flake8==7.0.0

      - name: Black format check
        run: black --check spark_jobs/ ingestion/ tests/

      - name: Flake8 lint
        run: flake8 spark_jobs/ ingestion/ tests/ --max-line-length=100 --extend-ignore=E203,W503

      - name: Run pytest
        run: python -m pytest tests/spark/ -v
